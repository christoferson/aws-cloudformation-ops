AWSTemplateFormatVersion: '2010-09-09'
Description: 'VPC Endpoints for AWS Systems Manager Session Manager and EC2 Instance Connect'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'VPC ID where the endpoints will be created'

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'Subnet IDs for the VPC endpoints (select at least one, preferably one per AZ). First subnet will be used for EIC endpoint.'

  VPCEndpointSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security Group ID for SSM VPC Endpoints'

  EICEndpointSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security Group ID for EC2 Instance Connect Endpoint'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: 'Network Configuration'
        Parameters:
          - VpcId
          - SubnetIds
      - Label:
          default: 'Security Groups'
        Parameters:
          - VPCEndpointSecurityGroupId
          - EICEndpointSecurityGroupId
    ParameterLabels:
      VpcId:
        default: 'VPC ID'
      SubnetIds:
        default: 'Subnet IDs for Endpoints'
      VPCEndpointSecurityGroupId:
        default: 'VPC Endpoint Security Group ID'
      EICEndpointSecurityGroupId:
        default: 'EIC Endpoint Security Group ID'

Resources:
  # SSM VPC Endpoint
  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-SSM-Endpoint'
        - Key: Service
          Value: 'SSM'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # SSM Messages VPC Endpoint
  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-SSMMessages-Endpoint'
        - Key: Service
          Value: 'SSM Messages'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # EC2 Messages VPC Endpoint
  EC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-EC2Messages-Endpoint'
        - Key: Service
          Value: 'EC2 Messages'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # EC2 Instance Connect Endpoint (uses first subnet from SubnetIds)
  EC2InstanceConnectEndpoint:
    Type: AWS::EC2::InstanceConnectEndpoint
    Properties:
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroupIds:
        - !Ref EICEndpointSecurityGroupId
      PreserveClientIp: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-EIC-Endpoint'
        - Key: Service
          Value: 'EC2 Instance Connect'
        - Key: ManagedBy
          Value: 'CloudFormation'

Outputs:
  SSMEndpointId:
    Description: 'SSM VPC Endpoint ID'
    Value: !Ref SSMEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-SSMEndpointId'

  SSMMessagesEndpointId:
    Description: 'SSM Messages VPC Endpoint ID'
    Value: !Ref SSMMessagesEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-SSMMessagesEndpointId'

  EC2MessagesEndpointId:
    Description: 'EC2 Messages VPC Endpoint ID'
    Value: !Ref EC2MessagesEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-EC2MessagesEndpointId'

  EC2InstanceConnectEndpointId:
    Description: 'EC2 Instance Connect Endpoint ID'
    Value: !Ref EC2InstanceConnectEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-EICEndpointId'

  EC2InstanceConnectEndpointSubnet:
    Description: 'Subnet where EIC Endpoint was created'
    Value: !Select [0, !Ref SubnetIds]
    Export:
      Name: !Sub '${AWS::StackName}-EICEndpointSubnet'

  SSMEndpointDNS:
    Description: 'SSM Endpoint DNS names'
    Value: !Join [', ', !GetAtt SSMEndpoint.DnsEntries]

  SSMMessagesEndpointDNS:
    Description: 'SSM Messages Endpoint DNS names'
    Value: !Join [', ', !GetAtt SSMMessagesEndpoint.DnsEntries]

  EC2MessagesEndpointDNS:
    Description: 'EC2 Messages Endpoint DNS names'
    Value: !Join [', ', !GetAtt EC2MessagesEndpoint.DnsEntries]

  VPCEndpointSecurityGroupUsed:
    Description: 'Security Group ID used for VPC Endpoints'
    Value: !Ref VPCEndpointSecurityGroupId

  EICEndpointSecurityGroupUsed:
    Description: 'Security Group ID used for EIC Endpoint'
    Value: !Ref EICEndpointSecurityGroupId

  StackInfo:
    Description: 'Stack information'
    Value: !Sub |
      VPC Endpoints created successfully in VPC ${VpcId}

      SSM Endpoints:
      - Private DNS is enabled for all SSM endpoints
      - Using security group: ${VPCEndpointSecurityGroupId}

      EC2 Instance Connect Endpoint:
      - Created in first subnet from SubnetIds list
      - Using security group: ${EICEndpointSecurityGroupId}
      - Note: Only one EIC endpoint allowed per subnet