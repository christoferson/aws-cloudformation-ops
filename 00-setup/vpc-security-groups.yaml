AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Security Groups for Multi-Tier Application Architecture

  Purpose:
    Creates a comprehensive set of security groups following the principle of least privilege
    for a typical AWS multi-tier application with web servers, application servers, databases,
    caching layer, file storage, and serverless functions.

  Security Groups Created:

    1. VPCEndpointSecurityGroup
       Purpose: For AWS PrivateLink VPC Endpoints (SSM, EC2Messages, SSMMessages, CloudWatch Logs)
       Ingress: TCP 443 from VPC CIDR
       Egress: All traffic (default)
       Used by: Interface VPC Endpoints

    2. EICEndpointSecurityGroup
       Purpose: For EC2 Instance Connect Endpoint
       Ingress: None (AWS managed service initiates connections)
       Egress: TCP 22 to VPC CIDR (SSH to instances)
       Used by: EC2 Instance Connect Endpoint

    3. LoadBalancerSecurityGroup
       Purpose: For Application Load Balancer (internet-facing)
       Ingress: TCP 80 (HTTP) and TCP 443 (HTTPS) from 0.0.0.0/0
       Egress: TCP 80, 443, 8080 to WebInstanceSecurityGroup
       Used by: Application Load Balancer, Network Load Balancer

    4. WebInstanceSecurityGroup
       Purpose: For web/application tier EC2 instances (receives traffic from ALB)
       Ingress: 
         - TCP 80, 443, 8080 from LoadBalancerSecurityGroup
         - TCP 22 from EICEndpointSecurityGroup
       Egress:
         - TCP 443 to VPCEndpointSecurityGroup (SSM, CloudWatch)
         - TCP 443, 80 to 0.0.0.0/0 (AWS APIs, package updates)
         - TCP 3306 (MySQL) to DatabaseSecurityGroup
         - TCP 5432 (PostgreSQL) to DatabaseSecurityGroup
         - TCP 6379 (Redis) to CacheSecurityGroup
         - TCP 11211 (Memcached) to CacheSecurityGroup
         - TCP 2049 (NFS) to EFSSecurityGroup
       Used by: EC2 instances in public/private subnets serving web traffic

    5. PrivateInstanceSecurityGroup
       Purpose: For backend/worker EC2 instances (no direct ALB access)
       Ingress:
         - All traffic from WebInstanceSecurityGroup
         - TCP 22 from EICEndpointSecurityGroup
       Egress:
         - TCP 443 to VPCEndpointSecurityGroup (SSM, CloudWatch)
         - TCP 443, 80 to 0.0.0.0/0 (AWS APIs, package updates)
         - TCP 3306 (MySQL) to DatabaseSecurityGroup
         - TCP 5432 (PostgreSQL) to DatabaseSecurityGroup
         - TCP 6379 (Redis) to CacheSecurityGroup
         - TCP 2049 (NFS) to EFSSecurityGroup
       Used by: Background workers, batch processors, internal services

    6. DatabaseSecurityGroup
       Purpose: For RDS/Aurora database instances
       Ingress:
         - TCP 3306 (MySQL/Aurora MySQL) from WebInstanceSecurityGroup
         - TCP 3306 from PrivateInstanceSecurityGroup
         - TCP 3306 from LambdaSecurityGroup
         - TCP 5432 (PostgreSQL/Aurora PostgreSQL) from WebInstanceSecurityGroup
         - TCP 5432 from PrivateInstanceSecurityGroup
         - TCP 5432 from LambdaSecurityGroup
       Egress: None (databases don't initiate outbound connections)
       Used by: RDS MySQL, RDS PostgreSQL, Aurora MySQL, Aurora PostgreSQL

    7. CacheSecurityGroup
       Purpose: For ElastiCache clusters (Redis/Memcached)
       Ingress:
         - TCP 6379 (Redis) from WebInstanceSecurityGroup
         - TCP 6379 from PrivateInstanceSecurityGroup
         - TCP 6379 from LambdaSecurityGroup
         - TCP 11211 (Memcached) from WebInstanceSecurityGroup
         - TCP 11211 from PrivateInstanceSecurityGroup
       Egress: None (cache doesn't initiate outbound connections)
       Used by: ElastiCache Redis, ElastiCache Memcached

    8. EFSSecurityGroup
       Purpose: For EFS mount targets
       Ingress:
         - TCP 2049 (NFS) from WebInstanceSecurityGroup
         - TCP 2049 from PrivateInstanceSecurityGroup
       Egress: None (EFS doesn't initiate outbound connections)
       Used by: EFS mount targets in each availability zone

    9. LambdaSecurityGroup
       Purpose: For VPC-enabled Lambda functions
       Ingress: None (Lambda doesn't receive inbound connections)
       Egress:
         - TCP 443 to VPCEndpointSecurityGroup (AWS APIs)
         - TCP 443 to 0.0.0.0/0 (external APIs)
         - TCP 3306 (MySQL) to DatabaseSecurityGroup
         - TCP 5432 (PostgreSQL) to DatabaseSecurityGroup
         - TCP 6379 (Redis) to CacheSecurityGroup
       Used by: Lambda functions attached to VPC subnets

  Traffic Flow:
    Internet → LoadBalancer → WebInstances → Database/Cache/EFS
                                          ↘ PrivateInstances → Database/Cache/EFS
    Lambda → Database/Cache/VPC Endpoints
    EIC Endpoint → Web/Private Instances (SSH)
    All Instances → VPC Endpoints (SSM, CloudWatch Logs)

  Network Architecture:
    - No instances have public IPs
    - All AWS service access via VPC Endpoints (PrivateLink)
    - Package updates via S3 Gateway Endpoint
    - SSH access via EC2 Instance Connect Endpoint (no bastion host)
    - Session Manager access via SSM VPC Endpoints

  Port Reference:
    22    - SSH
    80    - HTTP
    443   - HTTPS
    2049  - NFS (EFS)
    3306  - MySQL/Aurora MySQL
    5432  - PostgreSQL/Aurora PostgreSQL
    6379  - Redis
    8080  - Application (custom)
    11211 - Memcached

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'VPC ID where security groups will be created'

  VpcCidr:
    Type: String
    Description: 'VPC CIDR block for VPC endpoint access'
    Default: '10.0.0.0/16'
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: 'Network Configuration'
        Parameters:
          - VpcId
          - VpcCidr

Resources:
  # ============================================================================
  # VPC Endpoints Security Group
  # Purpose: Allow HTTPS access to VPC endpoints from within VPC
  # Used by: SSM, SSMMessages, EC2Messages, CloudWatch Logs endpoints
  # ============================================================================
  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-VPCEndpoint-SG'
      GroupDescription: 'Security group for VPC endpoints (SSM, EC2 Messages, CloudWatch Logs)'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: 'HTTPS from VPC for VPC endpoint access'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: 'Allow all outbound traffic'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-VPCEndpoint-SG'
        - Key: Purpose
          Value: 'VPC Endpoints'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # ============================================================================
  # EC2 Instance Connect Endpoint Security Group
  # Purpose: Allow SSH from EIC Endpoint to instances
  # Used by: EC2 Instance Connect Endpoint
  # ============================================================================
  EICEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-EIC-Endpoint-SG'
      GroupDescription: 'Security group for EC2 Instance Connect Endpoint'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref VpcCidr
          Description: 'SSH to instances in VPC'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-EIC-Endpoint-SG'
        - Key: Purpose
          Value: 'EC2 Instance Connect Endpoint'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # ============================================================================
  # Load Balancer Security Group
  # Purpose: Accept HTTP/HTTPS from internet, forward to web instances
  # Used by: Application Load Balancer
  # ============================================================================
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-LoadBalancer-SG'
      GroupDescription: 'Security group for Application Load Balancer'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
          Description: 'HTTPS from internet'
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
          Description: 'HTTP from internet'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: 'Allow all outbound traffic'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-LoadBalancer-SG'
        - Key: Purpose
          Value: 'Application Load Balancer'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # ============================================================================
  # Web/Application Instances Security Group
  # Purpose: Accept traffic from ALB, access databases/cache/EFS
  # Used by: EC2 instances serving web traffic
  # ============================================================================
  WebInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-WebInstance-SG'
      GroupDescription: 'Security group for web/application EC2 instances'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: 'HTTP from Load Balancer'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: 'HTTPS from Load Balancer'
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: 'Application port from Load Balancer'
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref EICEndpointSecurityGroup
          Description: 'SSH from EC2 Instance Connect Endpoint'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'HTTPS for package updates and AWS API calls'
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'HTTP for package updates'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-WebInstance-SG'
        - Key: Purpose
          Value: 'Web/Application Instances'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # Egress: Web Instance → VPC Endpoints (SSM, CloudWatch)
  WebInstanceToVPCEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref WebInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSecurityGroup
      Description: 'HTTPS to VPC endpoints for SSM and CloudWatch'

  # Egress: Web Instance → Database (MySQL)
  WebInstanceToDatabaseEgressMySQL:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref WebInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
      Description: 'MySQL/Aurora to database'

  # Egress: Web Instance → Database (PostgreSQL)
  WebInstanceToDatabaseEgressPostgres:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref WebInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
      Description: 'PostgreSQL to database'

  # Egress: Web Instance → Cache (Redis)
  WebInstanceToCacheEgressRedis:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref WebInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      DestinationSecurityGroupId: !Ref CacheSecurityGroup
      Description: 'Redis to cache'

  # Egress: Web Instance → Cache (Memcached)
  WebInstanceToCacheEgressMemcached:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref WebInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 11211
      ToPort: 11211
      DestinationSecurityGroupId: !Ref CacheSecurityGroup
      Description: 'Memcached to cache'

  # Egress: Web Instance → EFS
  WebInstanceToEFSEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref WebInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      DestinationSecurityGroupId: !Ref EFSSecurityGroup
      Description: 'NFS to EFS'

  # ============================================================================
  # Private/Backend Instances Security Group
  # Purpose: Backend processing, accepts traffic from web tier
  # Used by: Worker instances, batch processors
  # ============================================================================
  PrivateInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-PrivateInstance-SG'
      GroupDescription: 'Security group for private EC2 instances (no direct internet access)'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: -1
          SourceSecurityGroupId: !Ref WebInstanceSecurityGroup
          Description: 'All traffic from web instances'
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref EICEndpointSecurityGroup
          Description: 'SSH from EC2 Instance Connect Endpoint'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'HTTPS for package updates and AWS API calls'
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'HTTP for package updates'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-PrivateInstance-SG'
        - Key: Purpose
          Value: 'Private Backend Instances'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # Egress: Private Instance → VPC Endpoints
  PrivateInstanceToVPCEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref PrivateInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSecurityGroup
      Description: 'HTTPS to VPC endpoints for SSM and CloudWatch'

  # Egress: Private Instance → Database (MySQL)
  PrivateInstanceToDatabaseEgressMySQL:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref PrivateInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
      Description: 'MySQL/Aurora to database'

  # Egress: Private Instance → Database (PostgreSQL)
  PrivateInstanceToDatabaseEgressPostgres:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref PrivateInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
      Description: 'PostgreSQL to database'

  # Egress: Private Instance → Cache (Redis)
  PrivateInstanceToCacheEgressRedis:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref PrivateInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      DestinationSecurityGroupId: !Ref CacheSecurityGroup
      Description: 'Redis to cache'

  # Egress: Private Instance → EFS
  PrivateInstanceToEFSEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref PrivateInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      DestinationSecurityGroupId: !Ref EFSSecurityGroup
      Description: 'NFS to EFS'

  # ============================================================================
  # Database Security Group
  # Purpose: Accept database connections from application tiers
  # Used by: RDS MySQL, RDS PostgreSQL, Aurora
  # ============================================================================
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-Database-SG'
      GroupDescription: 'Security group for RDS/Aurora databases'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebInstanceSecurityGroup
          Description: 'MySQL/Aurora from web instances'
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref PrivateInstanceSecurityGroup
          Description: 'MySQL/Aurora from private instances'
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WebInstanceSecurityGroup
          Description: 'PostgreSQL from web instances'
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref PrivateInstanceSecurityGroup
          Description: 'PostgreSQL from private instances'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 127.0.0.1/32
          Description: 'No outbound access required'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Database-SG'
        - Key: Purpose
          Value: 'RDS/Aurora Database'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # ============================================================================
  # ElastiCache Security Group
  # Purpose: Accept cache connections from application tiers
  # Used by: ElastiCache Redis, ElastiCache Memcached
  # ============================================================================
  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-Cache-SG'
      GroupDescription: 'Security group for ElastiCache (Redis/Memcached)'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref WebInstanceSecurityGroup
          Description: 'Redis from web instances'
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref PrivateInstanceSecurityGroup
          Description: 'Redis from private instances'
        - IpProtocol: tcp
          FromPort: 11211
          ToPort: 11211
          SourceSecurityGroupId: !Ref WebInstanceSecurityGroup
          Description: 'Memcached from web instances'
        - IpProtocol: tcp
          FromPort: 11211
          ToPort: 11211
          SourceSecurityGroupId: !Ref PrivateInstanceSecurityGroup
          Description: 'Memcached from private instances'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 127.0.0.1/32
          Description: 'No outbound access required'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Cache-SG'
        - Key: Purpose
          Value: 'ElastiCache'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # ============================================================================
  # EFS Security Group
  # Purpose: Accept NFS connections from application tiers
  # Used by: EFS mount targets
  # ============================================================================
  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-EFS-SG'
      GroupDescription: 'Security group for EFS mount targets'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref WebInstanceSecurityGroup
          Description: 'NFS from web instances'
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref PrivateInstanceSecurityGroup
          Description: 'NFS from private instances'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 127.0.0.1/32
          Description: 'No outbound access required'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-EFS-SG'
        - Key: Purpose
          Value: 'EFS Mount Targets'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # ============================================================================
  # Lambda Security Group
  # Purpose: Allow Lambda to access databases, cache, and AWS services
  # Used by: VPC-enabled Lambda functions
  # ============================================================================
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-Lambda-SG'
      GroupDescription: 'Security group for VPC-enabled Lambda functions'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'HTTPS for AWS API calls'
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
          Description: 'MySQL/Aurora to database'
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
          Description: 'PostgreSQL to database'
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          DestinationSecurityGroupId: !Ref CacheSecurityGroup
          Description: 'Redis to cache'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Lambda-SG'
        - Key: Purpose
          Value: 'Lambda Functions'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # Egress: Lambda → VPC Endpoints
  LambdaToVPCEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSecurityGroup
      Description: 'HTTPS to VPC endpoints'

  # Ingress: Database ← Lambda (MySQL)
  DatabaseFromLambdaIngressMySQL:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: 'MySQL/Aurora from Lambda'

  # Ingress: Database ← Lambda (PostgreSQL)
  DatabaseFromLambdaIngressPostgres:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: 'PostgreSQL from Lambda'

  # Ingress: Cache ← Lambda (Redis)
  CacheFromLambdaIngressRedis:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CacheSecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: 'Redis from Lambda'

Outputs:
  VPCEndpointSecurityGroupId:
    Description: 'Security Group ID for VPC Endpoints'
    Value: !Ref VPCEndpointSecurityGroup

  EICEndpointSecurityGroupId:
    Description: 'Security Group ID for EC2 Instance Connect Endpoint'
    Value: !Ref EICEndpointSecurityGroup

  LoadBalancerSecurityGroupId:
    Description: 'Security Group ID for Load Balancer'
    Value: !Ref LoadBalancerSecurityGroup

  WebInstanceSecurityGroupId:
    Description: 'Security Group ID for Web/Application Instances'
    Value: !Ref WebInstanceSecurityGroup

  PrivateInstanceSecurityGroupId:
    Description: 'Security Group ID for Private Instances'
    Value: !Ref PrivateInstanceSecurityGroup

  DatabaseSecurityGroupId:
    Description: 'Security Group ID for Database'
    Value: !Ref DatabaseSecurityGroup

  CacheSecurityGroupId:
    Description: 'Security Group ID for ElastiCache'
    Value: !Ref CacheSecurityGroup

  EFSSecurityGroupId:
    Description: 'Security Group ID for EFS'
    Value: !Ref EFSSecurityGroup

  LambdaSecurityGroupId:
    Description: 'Security Group ID for Lambda Functions'
    Value: !Ref LambdaSecurityGroup