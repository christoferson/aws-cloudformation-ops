AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC2 instance with SSM Session Manager and EC2 Instance Connect enabled'

Parameters:
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: 'Latest Amazon Linux 2023 AMI ID from SSM Parameter Store'

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
    Description: 'EC2 instance type'

  VolumeSize:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 100
    Description: 'EBS volume size in GB'

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'VPC ID where the instance will be launched'

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: 'Subnet ID where the instance will be launched'

  EICEndpointSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security Group ID of the EC2 Instance Connect Endpoint'

  VPCEndpointSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security Group ID of the VPC Endpoints (SSM, SSMMessages, EC2Messages, CloudWatch Logs)'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: 'Instance Configuration'
        Parameters:
          - InstanceType
          - LatestAmiId
          - VolumeSize
      - Label:
          default: 'Network Configuration'
        Parameters:
          - VpcId
          - SubnetId
          - EICEndpointSecurityGroupId
          - VPCEndpointSecurityGroupId

Resources:
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - 'arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-EC2-Role'
        - Key: ManagedBy
          Value: 'CloudFormation'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-EC2-SG'
      GroupDescription: 'Security group for EC2 instance'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref EICEndpointSecurityGroupId
          Description: 'SSH from EC2 Instance Connect Endpoint'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'HTTPS for AWS services'
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'HTTP for package updates'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-EC2-SG'
        - Key: ManagedBy
          Value: 'CloudFormation'

  EC2ToVPCEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSecurityGroupId
      Description: 'HTTPS to VPC endpoints'

  EC2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-LaunchTemplate'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref EC2SecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref VolumeSize
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
              Iops: 3000
              Throughput: 125
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
          InstanceMetadataTags: enabled
        Monitoring:
          Enabled: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e
            exec > >(tee /var/log/user-data.log)
            exec 2>&1

            echo "Starting user data script at $(date)"

            dnf update -y
            dnf install -y amazon-cloudwatch-agent

            systemctl enable amazon-ssm-agent
            systemctl start amazon-ssm-agent

            systemctl enable sshd
            systemctl start sshd

            echo "Instance initialization completed at $(date)"
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-Instance'
              - Key: AccessMethod
                Value: 'SSM-and-InstanceConnect'
              - Key: ManagedBy
                Value: 'CloudFormation'
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-Volume'
              - Key: ManagedBy
                Value: 'CloudFormation'
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Name
              Value: !Sub '${AWS::StackName}-LaunchTemplate'
            - Key: ManagedBy
              Value: 'CloudFormation'

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref EC2LaunchTemplate
        Version: !GetAtt EC2LaunchTemplate.LatestVersionNumber
      SubnetId: !Ref SubnetId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Instance'
        - Key: ManagedBy
          Value: 'CloudFormation'

  InstanceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/ec2/${AWS::StackName}'
      RetentionInDays: 7
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-LogGroup'
        - Key: ManagedBy
          Value: 'CloudFormation'

Outputs:
  InstanceId:
    Description: 'EC2 Instance ID'
    Value: !Ref EC2Instance

  InstancePrivateIP:
    Description: 'Private IP address of the EC2 instance'
    Value: !GetAtt EC2Instance.PrivateIp

  EC2SecurityGroupId:
    Description: 'EC2 Instance Security Group ID'
    Value: !Ref EC2SecurityGroup

  LaunchTemplateId:
    Description: 'Launch Template ID'
    Value: !Ref EC2LaunchTemplate

  SSMConsoleURL:
    Description: 'Connect via SSM Session Manager'
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${EC2Instance}?region=${AWS::Region}'

  EC2ConsoleURL:
    Description: 'Connect via EC2 Instance Connect'
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/ec2/v2/home?region=${AWS::Region}#ConnectToInstance:instanceId=${EC2Instance}'